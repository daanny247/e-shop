{% extends 'base.html' %}

{% block content %}
<div class="row">
  <div class="col-md-3 col-lg-2 mb-4">
    <div class="list-group shadow-sm admin-sidebar">
      <a href="{{ url_for('admin.dashboard') }}"
         class="list-group-item list-group-item-action {% if request.endpoint == 'admin.dashboard' %}active{% endif %}">
        📊 Dashboard
      </a>
      <a href="{{ url_for('admin.categorias') }}"
         class="list-group-item list-group-item-action {% if request.endpoint and request.endpoint.startswith('admin.categoria') %}active{% endif %}">
        🏷️ Categorías
      </a>
      <a href="{{ url_for('admin.productos') }}"
         class="list-group-item list-group-item-action {% if request.endpoint and request.endpoint.startswith('admin.producto') %}active{% endif %}">
        🧴 Productos
      </a>
      <a href="{{ url_for('admin.clientes') }}"
         class="list-group-item list-group-item-action {% if request.endpoint and request.endpoint.startswith('admin.cliente') %}active{% endif %}">
        👥 Clientes
      </a>
      <a href="{{ url_for('admin.pedidos') }}"
         class="list-group-item list-group-item-action {% if request.endpoint and request.endpoint.startswith('admin.pedido') %}active{% endif %}">
        📦 Pedidos
      </a>
    </div>
  </div>

  <div class="col-md-9 col-lg-10">
    {% block admin_content %}{% endblock %}
  </div>
</div>
{% endblock %}
